services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: MentalHealthDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mindcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8085"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=MentalHealthDb;Username=postgres;Password=postgres"
      Jwt__Key: "lokalni-docker-jwt-kljuc-samo-za-razvoj-menjaj-za-produkciju"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      Cors__AllowedOrigins__1: "http://localhost:8080"
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mindcare_pgdata:
